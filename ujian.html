<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ujian — English Learning Hub</title>
<link rel="stylesheet" href="assets/style.css">
<script>try{document.documentElement.setAttribute("data-theme", localStorage.getItem("lms_theme")==="dark"?"dark":"light");}catch(e){}</script>
</head>
<body>

<div id="app-screen" class="no-sidebar">
  <div class="shell">

    <div class="main">
      <div class="topbar">
        <div class="topbar-left">
          <div class="topbar-userinfo">
            <div class="greeting"><span class="wave">👋</span>Halo, <span id="topName">—</span></div>
            <div class="date" id="topDate"></div>
          </div>
        </div>
        <div class="topbar-right">
          <div class="notif-wrap">
            <button class="notif-bell" id="notifBell" type="button" aria-label="Notifikasi">🔔<span class="notif-dot" id="notifDot" style="display:none;"></span></button>
            <div class="notif-dropdown" id="notifDropdown">
              <div class="notif-header">Notifikasi</div>
              <div id="notifList">Memuat…</div>
            </div>
          </div>
          <div class="level-pill"><span id="topLevel">X</span> · <span id="topKelasName">—</span></div>
        <button class="topbar-logout-btn" onclick="doLogout()" type="button" title="Keluar" aria-label="Keluar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
        </div>
      </div>

      <div class="content">
        <a href="menu.html" class="btn-back-menu">← Kembali ke Menu</a>
        <div class="page-header">
          <div class="eyebrow">Assessment</div>
          <h1>Ujian</h1>
        </div>
        <div class="materi-drawer-list" id="ujian-container">Memuat…</div>
      </div>
    </div>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabaseClient.js"></script>
<script src="assets/app.js"></script>
<script>
(async function () {
  const profile = await requireLogin();
  if (!profile) return;
  renderShell(profile, 'ujian');
  initNotifDropdown();
  await loadStudentNotifications(profile);

  const juC = document.getElementById('ujian-container');

  // RLS jadwal_ujian sudah otomatis membatasi hanya baris yang menyasar
  // tingkat/kelas siswa ini (lihat fungsi public.ujian_terlihat_untukku).
  const { data } = await supabase
    .from('jadwal_ujian')
    .select('id, judul, mulai, deadline, created_at')
    .order('created_at', { ascending: false });

  const now = new Date();
  const todayStr = now.toISOString().slice(0, 10);
  const items = data || [];

  const juIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6M12 2v6M6 8h12l1.5 12a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2L6 8Z"/><path d="M9 14h6M9 18h4"/></svg>';
  const chevronIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';

  juC.innerHTML = items.length ? items.map((j, i) => {
    const notStarted = j.mulai && new Date(j.mulai) > now;
    const closed = j.deadline && j.deadline < todayStr;

    let statusClass = 'status-open';
    let statusLabel = 'Terbuka';
    if (notStarted) { statusClass = 'status-due'; statusLabel = 'Belum Dibuka'; }
    else if (closed) { statusClass = 'status-due'; statusLabel = 'Sudah Ditutup'; }

    const mulaiTxt = j.mulai
      ? new Date(j.mulai).toLocaleString('id-ID', { day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' })
      : null;
    const deadlineTxt = j.deadline
      ? new Date(j.deadline).toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' })
      : null;
    const metaBits = [];
    if (mulaiTxt) metaBits.push((notStarted ? 'Mulai: ' : 'Dibuka sejak: ') + mulaiTxt);
    if (deadlineTxt) metaBits.push('Deadline: ' + deadlineTxt);

    const url = 'soal.html?jadwal=' + j.id;
    let btn;
    if (notStarted) {
      btn = `<a class="btn-ws" href="javascript:void(0)" style="opacity:.5;cursor:not-allowed;" onclick="alert('Ujian ini belum bisa dibuka. Mulai: ${esc(mulaiTxt)}.');return false;">Kerjakan</a>`;
    } else if (closed) {
      btn = `<a class="btn-ws" href="javascript:void(0)" style="opacity:.5;cursor:not-allowed;" onclick="alert('Ujian ini sudah melewati batas waktu.');return false;">Kerjakan</a>`;
    } else {
      btn = `<a class="btn-ws" href="${esc(url)}">Kerjakan</a>`;
    }

    return `
    <div class="materi-drawer-item" id="ju-item-${i}">
      <button type="button" class="materi-drawer-header" data-target="ju-item-${i}">
        <div class="materi-drawer-icon">${juIcon}</div>
        <div class="materi-drawer-heading">
          <div class="materi-drawer-tag">Ujian</div>
          <div class="materi-drawer-title">${esc(j.judul)}</div>
        </div>
        <div class="materi-drawer-chevron">${chevronIcon}</div>
      </button>
      <div class="materi-drawer-body">
        <div class="materi-drawer-body-inner">
          ${metaBits.length ? `<p>${metaBits.map(esc).join(' · ')}</p>` : ''}
          <div class="ws-drawer-actions">
            <span class="ws-status ${statusClass}">${statusLabel}</span>
            ${btn}
          </div>
        </div>
      </div>
    </div>`;
  }).join('') : emptyState("Belum ada ujian", "Ujian yang diterbitkan guru akan muncul di sini.", "🧪");

  juC.querySelectorAll('.materi-drawer-header').forEach((btn) => {
    btn.addEventListener('click', () => {
      const item = document.getElementById(btn.dataset.target);
      if (item) item.classList.toggle('open');
    });
  });
})();
</script>

</body>
</html>
