<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Materi — English Learning Hub</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  /* ===== Mobile bottom nav (menu siswa di bawah layar) ===== */
</style>
</head>
<body>

<div id="app-screen" class="no-sidebar">
  <div class="shell">

    <div class="main">
      <div class="topbar">
        <div class="topbar-left">
          <div class="topbar-userinfo">
            <div class="greeting"><span class="wave">👋</span>Halo, <span id="topName">—</span></div>
            <div class="date" id="topDate"></div>
          </div>
        </div>
        <div class="topbar-right">
          <div class="notif-wrap">
            <button class="notif-bell" id="notifBell" type="button" aria-label="Notifikasi">🔔<span class="notif-dot" id="notifDot" style="display:none;"></span></button>
            <div class="notif-dropdown" id="notifDropdown">
              <div class="notif-header">Notifikasi</div>
              <div id="notifList">Memuat…</div>
            </div>
          </div>
          <div class="level-pill"><span id="topLevel">X</span> · <span id="topKelasName">—</span></div>
        <button class="topbar-logout-btn" onclick="doLogout()" type="button" title="Keluar" aria-label="Keluar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
        </div>
      </div>

      <div class="content">
        <a href="menu.html" class="btn-back-menu">← Kembali ke Menu</a>
        <div class="page-header">
          <div class="eyebrow">Learn</div>
          <h1>Materi Pembelajaran</h1>
        </div>
        <div class="materi-grid" id="materi-container">Memuat…</div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabaseClient.js"></script>
<script src="assets/app.js"></script>
<script>
(async function () {
  const profile = await requireLogin();
  if (!profile) return;
  renderShell(profile, 'materi');
  initNotifDropdown();
  await loadStudentNotifications(profile);

  const materiC = document.getElementById('materi-container');
  const level = profile.kelas ? profile.kelas.level : getLevel(profile.kelas ? profile.kelas.nama : '');
  const { data } = await supabase
    .from('materi')
    .select('tag, judul, deskripsi, url')
    .or(`and(kelas_id.is.null,level.is.null),kelas_id.eq.${profile.kelas_id},level.eq.${level}`)
    .order('created_at', { ascending: true });

  const materi = data || [];
  materiC.innerHTML = materi.length ? materi.map(m => `
    <div class="materi-card">
      <div class="tag">${esc(m.tag || 'Materi')}</div>
      <h3>${esc(m.judul)}</h3>
      <p>${esc(m.deskripsi || '')}</p>
      <a class="dl" href="${m.url ? esc(m.url) : '#'}" target="_blank" rel="noopener">Buka Materi →</a>
    </div>
  `).join('') : emptyState("Belum ada materi", "Materi pembelajaran akan diunggah oleh guru di sini.", "📘");
})();
</script>

</body>
</html>
