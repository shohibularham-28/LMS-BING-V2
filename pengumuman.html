<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengumuman & Nilai — English Learning Hub</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div id="app-screen">
  <div class="shell">
    <div class="sidebar">
      <div class="brand">
        <div class="brand-icon"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 5.5C4 4.67157 4.67157 4 5.5 4H10.5C11.3284 4 12 4.67157 12 5.5V19.5C12 18.6716 11.3284 18 10.5 18H4V5.5Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/><path d="M20 5.5C20 4.67157 19.3284 4 18.5 4H13.5C12.6716 4 12 4.67157 12 5.5V19.5C12 18.6716 12.6716 18 13.5 18H20V5.5Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
        <div class="brand-name display">English Class</div>
      </div>

      <div class="user-card">
        <div class="avatar" id="userAvatar">D</div>
        <div class="name" id="sideName">—</div>
        <span class="kelas-tag" id="sideClass">Kelas —</span>
      </div>

      <div class="nav-section-label">Menu Utama</div>
      <a class="nav-item active" data-page="pengumuman" href="pengumuman.html" title="Pengumuman & Nilai">
        <span class="icon">📣</span> <span class="label">Pengumuman &amp; Nilai</span>
      </a>
      <a class="nav-item" data-page="materi" href="materi.html" title="Materi">
        <span class="icon">📘</span> <span class="label">Materi</span>
      </a>
      <a class="nav-item" data-page="worksheet" href="worksheet.html" title="Worksheet">
        <span class="icon">📝</span> <span class="label">Worksheet</span>
      </a>

      <div class="nav-section-label">Akun</div>
      <a class="nav-item" data-page="pengaturan" href="pengaturan.html" title="Pengaturan">
        <span class="icon">⚙️</span> <span class="label">Pengaturan</span>
      </a>

      <div class="sidebar-footer">
        <button class="logout-btn" onclick="doLogout()" title="Keluar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> <span class="logout-label">Keluar</span></button>
      </div>
    </div>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="main">
      <div class="topbar">
        <div class="topbar-left">
          <button class="nav-toggle-btn" id="navToggle" type="button" aria-label="Buka/tutup menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
          <div class="topbar-userinfo">
            <div class="greeting"><span class="wave">👋</span>Halo, <span id="topName">—</span></div>
            <div class="date" id="topDate"></div>
          </div>
        </div>
        <div class="topbar-right">
          <div class="notif-wrap">
            <button class="notif-bell" id="notifBell" type="button" aria-label="Notifikasi">🔔<span class="notif-dot" id="notifDot" style="display:none;"></span></button>
            <div class="notif-dropdown" id="notifDropdown">
              <div class="notif-header">Notifikasi</div>
              <div id="notifList">Memuat…</div>
            </div>
          </div>
          <div class="level-pill"><span id="topLevel">X</span> · <span id="topKelasName">—</span></div>
        </div>
      </div>

      <div class="content">
        <div class="page-header">
          <div class="eyebrow">Update</div>
          <h1>Pengumuman &amp; Nilai</h1>
        </div>
        <div id="ann-container">Memuat…</div>
        <div class="section-label">Rekap Nilai Terbaru</div>
        <div class="table-responsive">
          <table class="grade-table" id="grade-table">
            <thead>
              <tr><th>Jenis Penilaian</th><th>Skor</th><th>Nilai Asli (Sebelum Penalti)</th><th>Predikat</th><th>Keterangan</th><th>Status</th></tr>
            </thead>
            <tbody id="grade-container"></tbody>
          </table>
        </div>
        <div id="grade-empty-slot"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabaseClient.js"></script>
<script src="assets/app.js"></script>
<script>
(async function () {
  const profile = await requireLogin();
  if (!profile) return;
  renderShell(profile, 'pengumuman');
  initSidebarToggle();
  initNotifDropdown();
  await loadStudentNotifications(profile);

  // Pengumuman: milik kelas ini atau untuk semua kelas
  const annC = document.getElementById('ann-container');
  const { data: annData } = await supabase
    .from('pengumuman')
    .select('judul, isi, created_at')
    .or(`kelas_id.eq.${profile.kelas_id},kelas_id.is.null`)
    .order('created_at', { ascending: false });

  const announcements = annData || [];
  annC.innerHTML = announcements.length ? announcements.map(a => `
    <div class="ann-card">
      <div class="ann-date">${new Date(a.created_at).toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' })}</div>
      <h3>${esc(a.judul)}</h3>
      <p>${linkify(a.isi)}</p>
    </div>
  `).join('') : emptyState("Belum ada pengumuman", "Pengumuman terbaru akan muncul di sini.", "📣");

  // Nilai milik siswa ini
  const gradeTable = document.getElementById('grade-table');
  const gradeC = document.getElementById('grade-container');
  const gradeEmptySlot = document.getElementById('grade-empty-slot');
  const { data: myGrades } = await supabase
    .from('nilai')
    .select('jenis, skor, skor_asli, predikat, keterangan')
    .eq('siswa_id', profile.id)
    .order('created_at', { ascending: false });

  const grades = myGrades || [];
  if (grades.length) {
    gradeTable.style.display = '';
    gradeEmptySlot.innerHTML = '';
    gradeC.innerHTML = grades.map(g => {
      const isNumeric = typeof g.skor === 'number';
      const statusCls = !isNumeric ? 'status-belum' : (g.skor < 75 ? 'status-remidi' : 'status-tuntas');
      const statusTxt = !isNumeric ? 'Belum Mengerjakan' : (g.skor < 75 ? 'Remidi' : 'Tuntas');
      return `
      <tr>
        <td>${esc(g.jenis)}</td>
        <td>${g.skor ?? '-'}</td>
        <td>${typeof g.skor_asli === 'number' ? g.skor_asli : '-'}</td>
        <td><span class="score-pill ${isNumeric && g.skor >= 85 ? 'score-high' : 'score-mid'}">${esc(g.predikat || '-')}</span></td>
        <td>${g.keterangan ? esc(g.keterangan) : '-'}</td>
        <td><span class="score-pill ${statusCls}">${statusTxt}</span></td>
      </tr>
    `;
    }).join('');
  } else {
    gradeTable.style.display = 'none';
    gradeC.innerHTML = '';
    gradeEmptySlot.innerHTML = emptyState("Belum ada nilai", "Nilai yang sudah dinilai guru akan tampil di sini.", "📊");
  }

  // Siswa sudah melihat halaman ini, tandai pengumuman & nilai sebagai sudah dibaca.
  await markUpdatesSeen(profile);
})();
</script>

</body>
</html>
