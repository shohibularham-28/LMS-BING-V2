<style>
  html,body{height:100%;margin:0;background:#0f172a;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #app{display:flex;flex-direction:column;height:100%}
  #stage{flex:1;position:relative;min-height:0;background:#fff}
  #stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
  #stage iframe.active{display:block}
  #bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:#0f172a;color:#e2e8f0;border-top:1px solid #334155}

  #bar button:hover:not(:disabled){background:#4f46e5}
  #bar button.ghost{background:#1e293b;color:#cbd5e1}
  #bar button.ghost:hover:not(:disabled){background:#334155}
  #bar button:disabled{opacity:.35;cursor:not-allowed}
  #info{text-align:center;min-width:0}
  #ttl{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #dots{display:flex;gap:6px;justify-content:center;margin-top:6px}
  #dots span{width:8px;height:8px;border-radius:50%;background:#475569;cursor:pointer;transition:all .2s}
  #dots span.on{background:#818cf8;width:22px;border-radius:4px}
  @media(max-width:480px){#bar{padding:8px 10px}#bar button{padding:9px 14px}#ttl{font-size:12px}}
</style>
</head>

const stage = document.getElementById('stage');
const dots = document.getElementById('dots');
const frames = [];
let cur = 0;

function decode(b64){
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
PAGES.forEach((_, i) => {
  const d = document.createElement('span');
  d.title = TITLES[i];
  d.onclick = () => go(i);
  dots.appendChild(d);
});
function go(i){
  if (i < 0 || i >= PAGES.length) return;
  cur = i;
  if (!frames[i]) {
    const f = document.createElement('iframe');
    f.title = TITLES[i];
    f.srcdoc = decode(PAGES[i]);
    stage.appendChild(f);
    frames[i] = f;
  }
  frames.forEach((f, k) => f && f.classList.toggle('active', k === i));
  [...dots.children].forEach((d, k) => d.classList.toggle('on', k === i));
  document.getElementById('ttl').textContent = (i + 1) + '/' + PAGES.length + ' · ' + TITLES[i];
  document.getElementById('prev').disabled = i === 0;
  const n = document.getElementById('next');
  n.disabled = i === PAGES.length - 1;
  n.textContent = i === PAGES.length - 1 ? 'Selesai' : 'Next →';
}
document.getElementById('prev').onclick = () => go(cur - 1);
document.getElementById('next').onclick = () => go(cur + 1);
go(0);
</script>
