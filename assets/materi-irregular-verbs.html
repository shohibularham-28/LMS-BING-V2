<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Irregular Verbs</title>
<style>
  :root{
    --navy:#0a2540;
    --navy-dark:#071a30;
    --navy-light:#153a5f;
    --card:#ffffff;
    --accent:#0a2540;
    --accent2:#1d4e8f;
    --text:#0a2540;
    --muted:#5b6b7d;
    --border:#dbe3ec;
    --bg:#f4f7fb;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:24px;
  }
  .container{
    max-width:960px;
    margin:0 auto;
  }
  h1{
    text-align:center;
    font-size:28px;
    margin-bottom:4px;
    color:var(--navy);
    font-weight:700;
    letter-spacing:.01em;
  }
  p.subtitle{
    text-align:center;
    color:var(--muted);
    margin-top:0;
    margin-bottom:24px;
    font-size:14px;
  }
  .controls{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    margin-bottom:20px;
    box-shadow:0 8px 24px rgba(10,37,64,.08);
  }
  .search-box{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 14px;
    margin-bottom:14px;
  }
  .search-box input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-size:15px;
  }
  .search-box svg{flex-shrink:0;}
  .letters{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .letter-btn{
    border:1px solid var(--border);
    background:#ffffff;
    color:var(--muted);
    width:32px;
    height:32px;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
    font-weight:600;
    transition:all .15s ease;
  }
  .letter-btn:hover{
    border-color:var(--navy);
    color:var(--navy);
  }
  .letter-btn.active{
    background:var(--navy);
    color:#ffffff;
    border-color:var(--navy);
  }
  .letter-btn.disabled{
    opacity:.3;
    cursor:not-allowed;
    pointer-events:none;
  }
  .info-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    font-size:13px;
    color:var(--muted);
  }
  .reset-btn{
    background:none;
    border:1px solid var(--border);
    color:var(--muted);
    padding:5px 12px;
    border-radius:8px;
    cursor:pointer;
    font-size:12px;
  }
  .reset-btn:hover{color:var(--navy);border-color:var(--navy);}
  .table-wrap{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 8px 24px rgba(10,37,64,.08);
  }
  table{
    width:100%;
    border-collapse:collapse;
  }
  thead tr{
    background:var(--navy);
  }
  th{
    text-align:left;
    padding:12px 16px;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:#ffffff;
    border-bottom:1px solid var(--border);
  }
  td{
    padding:12px 16px;
    border-bottom:1px solid var(--border);
    font-size:15px;
  }
  tbody tr:hover{
    background:#eef3f9;
  }
  tbody tr:last-child td{border-bottom:none;}
  .v1{color:var(--navy);font-weight:700;}
  .v2{color:var(--accent2);font-weight:700;}
  .v3{color:#334e68;font-weight:700;}
  .meaning{color:var(--muted);font-style:italic;}
  .empty{
    text-align:center;
    padding:40px;
    color:var(--muted);
  }
  .badge{
    display:inline-block;
    background:#eef3f9;
    color:var(--navy);
    padding:2px 8px;
    border-radius:6px;
    font-size:12px;
    margin-left:6px;
  }
  @media(max-width:600px){
    th,td{padding:8px;font-size:13px;}
    h1{font-size:22px;}
  }
</style>
</head>
<body>
<div class="container">
  <h1>Irregular Verbs</h1>
  <p class="subtitle">Base Form &bull; Past Simple &bull; Past Participle &mdash; cari atau filter berdasarkan huruf depan</p>

  <div class="controls">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b6b7d" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" placeholder="Ketik kata (misal: go, went, pergi)...">
    </div>
    <div class="letters" id="letterFilters"></div>
  </div>

  <div class="info-row">
    <span id="resultCount"></span>
    <button class="reset-btn" onclick="resetFilters()">Reset Filter</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Base Form (V1)</th>
          <th>Past Simple (V2)</th>
          <th>Past Participle (V3)</th>
          <th>Arti</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="empty" id="emptyState" style="display:none;">Tidak ada kata kerja yang cocok 😔</div>
  </div>
</div>

<script>
const verbs = [

  ["awake","awoke","awoken","terbangun"],
  ["be","was/were","been","adalah/menjadi"],
  ["bear","bore","born/borne","melahirkan/menanggung"],

  ["bend","bent","bent","membengkokkan"],
  ["bet","bet","bet","bertaruh"],
  ["bid","bid","bid","menawar"],
  ["bind","bound","bound","mengikat"],
  ["bite","bit","bitten","menggigit"],
  ["bleed","bled","bled","berdarah"],
  ["blow","blew","blown","meniup"],
  ["break","broke","broken","memecahkan"],
  ["breed","bred","bred","membiakkan"],
  ["bring","brought","brought","membawa"],
  ["broadcast","broadcast","broadcast","menyiarkan"],
  ["build","built","built","membangun"],
  ["burn","burnt/burned","burnt/burned","membakar"],
  ["burst","burst","burst","meledak/pecah"],
  ["buy","bought","bought","membeli"],
  ["cast","cast","cast","melemparkan"],
  ["catch","caught","caught","menangkap"],
  ["choose","chose","chosen","memilih"],
  ["cling","clung","clung","berpegang erat"],
  ["come","came","come","datang"],
  ["cost","cost","cost","berharga/berbiaya"],
  ["creep","crept","crept","merayap"],
  ["cut","cut","cut","memotong"],
  ["deal","dealt","dealt","menangani/membagikan"],
  ["dig","dug","dug","menggali"],
  ["dive","dove/dived","dived","menyelam"],
  ["do","did","done","melakukan"],
  ["draw","drew","drawn","menggambar"],
  ["dream","dreamt/dreamed","dreamt/dreamed","bermimpi"],
  ["drink","drank","drunk","minum"],
  ["drive","drove","driven","mengemudi"],
  ["dwell","dwelt","dwelt","tinggal/berdiam"],
  ["eat","ate","eaten","makan"],
  ["fall","fell","fallen","jatuh"],
  ["feed","fed","fed","memberi makan"],
  ["feel","felt","felt","merasakan"],
  ["fight","fought","fought","berkelahi"],
  ["find","found","found","menemukan"],
  ["fit","fit","fit","cocok/pas"],
  ["flee","fled","fled","melarikan diri"],
  ["fling","flung","flung","melemparkan (keras)"],
  ["fly","flew","flown","terbang"],
  ["forbid","forbade","forbidden","melarang"],
  ["forecast","forecast","forecast","meramalkan"],
  ["forget","forgot","forgotten","melupakan"],
  ["forgive","forgave","forgiven","memaafkan"],
  ["forsake","forsook","forsaken","meninggalkan/mengabaikan"],
  ["freeze","froze","frozen","membeku"],
  ["get","got","gotten/got","mendapatkan"],
  ["give","gave","given","memberi"],
  ["go","went","gone","pergi"],
  ["grind","ground","ground","menggiling"],
  ["grow","grew","grown","tumbuh"],
  ["hang","hung","hung","menggantung"],
  ["have","had","had","memiliki"],
  ["hear","heard","heard","mendengar"],
  ["hide","hid","hidden","menyembunyikan"],
  ["hit","hit","hit","memukul"],
  ["hold","held","held","memegang"],
  ["hurt","hurt","hurt","melukai"],
  ["keep","kept","kept","menyimpan"],
  ["kneel","knelt","knelt","berlutut"],
  ["knit","knit","knit","merajut"],
  ["know","knew","known","mengetahui"],
  ["lay","laid","laid","meletakkan"],
  ["lead","led","led","memimpin"],
  ["lean","leant/leaned","leant/leaned","bersandar"],
  ["leap","leapt/leaped","leapt/leaped","melompat"],
  ["learn","learnt/learned","learnt/learned","belajar"],
  ["leave","left","left","meninggalkan"],
  ["lend","lent","lent","meminjamkan"],
  ["let","let","let","membiarkan"],
  ["lie","lay","lain","berbaring"],
  ["light","lit/lighted","lit/lighted","menyalakan"],
  ["lose","lost","lost","kehilangan"],
  ["make","made","made","membuat"],
  ["mean","meant","meant","berarti"],
  ["meet","met","met","bertemu"],
  ["mistake","mistook","mistaken","salah mengira"],
  ["mow","mowed","mown/mowed","memotong rumput"],
  ["overcome","overcame","overcome","mengatasi"],

  ["pay","paid","paid","membayar"],

  ["rid","rid","rid","membebaskan/menyingkirkan"],
  ["ride","rode","ridden","mengendarai"],
  ["ring","rang","rung","berdering"],
  ["rise","rose","risen","bangkit"],
  ["run","ran","run","berlari"],
  ["saw","sawed","sawn/sawed","menggergaji"],
  ["say","said","said","mengatakan"],
  ["see","saw","seen","melihat"],
  ["seek","sought","sought","mencari"],
  ["sell","sold","sold","menjual"],
  ["send","sent","sent","mengirim"],
  ["set","set","set","mengatur/menetapkan"],
  ["sew","sewed","sewn/sewed","menjahit"],
  ["shake","shook","shaken","mengguncang"],
  ["shave","shaved","shaven/shaved","mencukur"],
  ["shear","sheared","shorn/sheared","mencukur (bulu)"],
  ["shed","shed","shed","menumpahkan/merontokkan"],
  ["shine","shone","shone","bersinar"],
  ["shoot","shot","shot","menembak"],
  ["show","showed","shown","menunjukkan"],
  ["shrink","shrank","shrunk","menyusut"],
  ["shut","shut","shut","menutup"],
  ["sing","sang","sung","menyanyi"],
  ["sink","sank","sunk","tenggelam"],
  ["sit","sat","sat","duduk"],
  ["slay","slew","slain","membunuh"],
  ["sleep","slept","slept","tidur"],
  ["slide","slid","slid","meluncur/tergelincir"],
  ["sling","slung","slung","melemparkan"],
  ["slink","slunk","slunk","mengendap-endap"],
  ["slit","slit","slit","menyayat"],
  ["smell","smelt/smelled","smelt/smelled","mencium bau"],
  ["sow","sowed","sown/sowed","menabur"],
  ["speak","spoke","spoken","berbicara"],
  ["speed","sped/speeded","sped/speeded","mempercepat"],
  ["spell","spelt/spelled","spelt/spelled","mengeja"],
  ["spend","spent","spent","menghabiskan"],
  ["spill","spilt/spilled","spilt/spilled","menumpahkan"],
  ["spin","spun","spun","memutar"],
  ["spit","spat/spit","spat/spit","meludah"],
  ["split","split","split","membelah"],
  ["spoil","spoilt/spoiled","spoilt/spoiled","merusak/memanjakan"],
  ["spread","spread","spread","menyebarkan"],
  ["spring","sprang","sprung","melompat/muncul"],
  ["stand","stood","stood","berdiri"],
  ["steal","stole","stolen","mencuri"],
  ["stick","stuck","stuck","menempel"],
  ["sting","stung","stung","menyengat"],
  ["stink","stank","stunk","berbau busuk"],
  ["stride","strode","stridden","melangkah lebar"],
  ["strike","struck","struck","memukul/mogok"],
  ["string","strung","strung","merangkai/memasang tali"],
  ["strive","strove","striven","berjuang/berusaha"],
  ["swear","swore","sworn","bersumpah"],
  ["sweep","swept","swept","menyapu"],
  ["swell","swelled","swollen/swelled","membengkak"],
  ["swim","swam","swum","berenang"],
  ["swing","swung","swung","mengayun"],
  ["take","took","taken","mengambil"],
  ["teach","taught","taught","mengajar"],
  ["tear","tore","torn","merobek"],
  ["tell","told","told","memberitahu"],
  ["think","thought","thought","berpikir"],
  ["thrive","throve/thrived","thriven/thrived","berkembang pesat"],
  ["throw","threw","thrown","melempar"],
  ["thrust","thrust","thrust","mendorong keras"],
  ["tread","trod","trodden","menginjak"],
  ["understand","understood","understood","memahami"],
  ["undertake","undertook","undertaken","melaksanakan/menjalankan tugas"],
  ["upset","upset","upset","mengganggu/membuat kesal"],
  ["wake","woke","woken","bangun"],
  ["wear","wore","worn","memakai"],
  ["weave","wove","woven","menenun"],
  ["wed","wed/wedded","wed/wedded","menikahi"],
  ["weep","wept","wept","menangis"],
  ["wet","wet/wetted","wet/wetted","membasahi"],
  ["win","won","won","menang"],
  ["wind","wound","wound","memutar/melilit"],
  ["withdraw","withdrew","withdrawn","menarik diri/menarik uang"],
  ["wring","wrung","wrung","memeras (kain)"],
  ["write","wrote","written","menulis"]
];

const tableBody = document.getElementById('tableBody');
const searchInput = document.getElementById('searchInput');
const letterFilters = document.getElementById('letterFilters');
const resultCount = document.getElementById('resultCount');
const emptyState = document.getElementById('emptyState');

let activeLetter = null;

// Build letter filter buttons A-Z, disable letters with no verbs
const availableLetters = new Set(verbs.map(v => v[0][0].toUpperCase()));
const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

alphabet.forEach(letter => {
  const btn = document.createElement('button');
  btn.className = 'letter-btn' + (availableLetters.has(letter) ? '' : ' disabled');
  btn.textContent = letter;
  btn.onclick = () => {
    activeLetter = (activeLetter === letter) ? null : letter;
    updateLetterButtons();
    render();
  };
  btn.dataset.letter = letter;
  letterFilters.appendChild(btn);
});

function updateLetterButtons(){
  document.querySelectorAll('.letter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.letter === activeLetter);
  });
}

function resetFilters(){
  activeLetter = null;
  searchInput.value = '';
  updateLetterButtons();
  render();
}

function render(){
  const query = searchInput.value.trim().toLowerCase();

  const filtered = verbs.filter(v => {
    const matchesLetter = !activeLetter || v[0][0].toUpperCase() === activeLetter;
    const matchesSearch = !query || v.some(field => field.toLowerCase().includes(query));
    return matchesLetter && matchesSearch;
  });

  tableBody.innerHTML = '';
  if(filtered.length === 0){
    emptyState.style.display = 'block';
  } else {
    emptyState.style.display = 'none';
    filtered.forEach(v => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="v1">${v[0]}</td>
        <td class="v2">${v[1]}</td>
        <td class="v3">${v[2]}</td>
        <td class="meaning">${v[3]}</td>
      `;
      tableBody.appendChild(tr);
    });
  }

  resultCount.textContent = `Menampilkan ${filtered.length} dari ${verbs.length} kata kerja` + (activeLetter ? ` — huruf "${activeLetter}"` : '');
}

render();
</script>
</body>
</html>
