<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cari Kata — English Learning Hub</title>
<link rel="stylesheet" href="assets/style.css">
<script>try{document.documentElement.setAttribute("data-theme", localStorage.getItem("lms_theme")==="dark"?"dark":"light");}catch(e){}</script>
<style>
  :root{
    --ck-accent1:#1fa15a; --ck-accent2:#43d17a; --ck-amber1:#ffb703; --ck-amber2:#ff9f1c;
  }
  body{ background:radial-gradient(circle at 6% 4%, #e8fbf0 0%, transparent 45%), radial-gradient(circle at 96% 10%, #fff6e0 0%, transparent 40%), linear-gradient(180deg,#f6fffa 0%, #fffef6 100%); }
  .ck-wrap{ max-width:640px; margin:0 auto; padding:18px 16px 60px; }
  .ck-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .ck-top a{ color:#1fa15a; font-weight:800; text-decoration:none; font-size:13.5px; }
  .ck-progress{ font-size:12.5px; color:#fff; font-weight:800; background:linear-gradient(135deg,var(--ck-accent1),var(--ck-accent2)); padding:6px 14px; border-radius:99px; box-shadow:0 4px 12px rgba(31,161,90,.3); }
  .ck-card{ position:relative; background:#fff; border-radius:22px; padding:22px 16px 20px; box-shadow:0 14px 34px rgba(30,90,60,0.12); overflow:hidden; }
  .ck-card::before{ content:""; position:absolute; top:0; left:0; right:0; height:8px; background:linear-gradient(90deg,var(--ck-accent1),var(--ck-amber1),var(--ck-accent2)); }
  .ck-instruksi{
    display:inline-block; font-size:12px; color:#fff; margin-bottom:16px; font-weight:800; text-transform:uppercase; letter-spacing:.03em;
    background:linear-gradient(135deg,var(--ck-accent1),var(--ck-accent2)); padding:8px 16px; border-radius:99px;
  }

  .ck-wordlist{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .ck-word-chip{ background:#eafaf0; border:2px solid #c7ecd6; border-radius:99px; padding:7px 14px; font-weight:800; font-size:13px; color:#136b38; }
  .ck-word-chip.found{ background:linear-gradient(135deg,var(--ck-accent1),var(--ck-accent2)); border-color:transparent; color:#fff; text-decoration:line-through; opacity:.8; }

  .ck-grid{ display:grid; gap:3px; user-select:none; touch-action:none; margin:0 auto 18px; max-width:100%; width:fit-content; background:#eafaf0; padding:8px; border-radius:14px; }
  .ck-cell{
    display:flex; align-items:center; justify-content:center; background:#fff; border-radius:8px;
    font-weight:800; font-family:'Courier New',monospace; color:#1f2937; cursor:pointer; box-shadow:0 2px 0 #e2f4e9; transition:background .1s,transform .1s;
  }
  .ck-cell.selecting{ background:linear-gradient(135deg,var(--ck-amber1),var(--ck-amber2)); color:#fff; transform:scale(1.06); box-shadow:0 2px 0 #c98a00; }
  .ck-cell.found{ background:linear-gradient(135deg,var(--ck-accent1),var(--ck-accent2)); color:#fff; box-shadow:0 2px 0 #16803f; }

  .ck-final{ text-align:center; padding:30px 10px; }
  .ck-final .skor-besar{ font-size:46px; font-weight:900; background:linear-gradient(135deg,var(--ck-accent1),var(--ck-amber1)); -webkit-background-clip:text; background-clip:text; color:transparent; margin:12px 0; }
  .ck-final button{ margin-top:16px; padding:12px 22px; border-radius:13px; border:none; background:linear-gradient(135deg,var(--ck-accent1),var(--ck-accent2)); color:#fff; font-weight:800; cursor:pointer; }
  .ck-loading{ text-align:center; padding:60px 10px; color:#8A90A3; font-weight:700; }
</style>
</head>
<body>

<div class="ck-wrap">
  <div class="ck-top">
    <a href="menu-game.html">‹ Keluar</a>
    <div class="ck-progress" id="ckProgress"></div>
  </div>
  <div id="ckContainer"><div class="ck-loading">Memuat soal…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabaseClient.js"></script>
<script src="assets/app.js"></script>
<script>
const params = new URLSearchParams(location.search);
const MODE = params.get('mode');           // 'mandiri' | 'live'
const BANK_ID = params.get('id');
const KODE = (params.get('kode') || '').toUpperCase();

let PROFILE = null;
let BANK_GAME_ID = null;
let SESI = null;             // hanya kalau mode live
let PESERTA = null;          // hanya kalau mode live
let WORDS = [];               // daftar kata (string)
let PUZZLE = null;            // { size, grid, placements }
let ditemukan = new Set();    // kata yang sudah ketemu
let skorTotal = 0;
let mulaiWaktu = 0;
let CELL_PX = 30;

function buatPuzzleBaru() {
  ditemukan = new Set();
  PUZZLE = buatGridCariKata(WORDS);
  mulaiWaktu = Date.now();
}

function renderProgress() {
  document.getElementById('ckProgress').textContent = `Ditemukan ${ditemukan.size} / ${WORDS.length} · Skor: ${skorTotal}`;
}

function renderSoal() {
  const c = document.getElementById('ckContainer');
  if (!PUZZLE || !PUZZLE.size) {
    c.innerHTML = emptyState('Materi tidak bisa dimuat', 'Daftar kata terlalu banyak/panjang untuk dibuat papan. Hubungi gurumu.', '⚠️');
    return;
  }
  renderProgress();
  CELL_PX = Math.max(24, Math.min(38, Math.floor(560 / PUZZLE.size)));
  c.innerHTML = `
    <div class="ck-card">
      <div class="ck-instruksi">Seret dari huruf awal ke huruf akhir untuk menemukan kata</div>
      <div class="ck-wordlist" id="ckWordlist"></div>
      <div class="ck-grid" id="ckGrid" style="grid-template-columns:repeat(${PUZZLE.size}, ${CELL_PX}px);"></div>
    </div>
  `;
  gridEventsTerpasang = false;
  renderWordlist();
  renderGrid();
}

function renderWordlist() {
  const el = document.getElementById('ckWordlist');
  if (!el) return;
  el.innerHTML = WORDS.map(w => `<span class="ck-word-chip ${ditemukan.has(w.toUpperCase()) ? 'found' : ''}">${esc(w)}</span>`).join('');
}

function renderGrid() {
  const grid = document.getElementById('ckGrid');
  if (!grid) return;
  const foundCellSet = new Set();
  PUZZLE.placements.forEach(p => { if (ditemukan.has(p.kata)) p.cells.forEach(([r, c]) => foundCellSet.add(`${r},${c}`)); });

  grid.innerHTML = '';
  for (let r = 0; r < PUZZLE.size; r++) {
    for (let c = 0; c < PUZZLE.size; c++) {
      const div = document.createElement('div');
      div.className = 'ck-cell' + (foundCellSet.has(`${r},${c}`) ? ' found' : '');
      div.style.width = CELL_PX + 'px';
      div.style.height = CELL_PX + 'px';
      div.style.fontSize = Math.floor(CELL_PX * 0.5) + 'px';
      div.dataset.r = r; div.dataset.c = c;
      div.textContent = PUZZLE.grid[r][c];
      grid.appendChild(div);
    }
  }
  pasangInteraksiGrid(grid);
}

// ===================== Interaksi drag/seret (mouse & sentuh) =====================
let sedangMemilih = false;
let selAwal = null, selAkhir = null;

let gridEventsTerpasang = false;

function pasangInteraksiGrid(grid) {
  grid.querySelectorAll('.ck-cell').forEach(cell => {
    cell.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      sedangMemilih = true;
      selAwal = { r: Number(cell.dataset.r), c: Number(cell.dataset.c) };
      selAkhir = selAwal;
      gambarSeleksi(grid);
    });
  });
  if (gridEventsTerpasang) return;
  gridEventsTerpasang = true;
  grid.addEventListener('pointermove', (e) => {
    if (!sedangMemilih) return;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    if (!el || !el.classList || !el.classList.contains('ck-cell')) return;
    const cand = { r: Number(el.dataset.r), c: Number(el.dataset.c) };
    const dr = cand.r - selAwal.r, dc = cand.c - selAwal.c;
    const lurus = dr === 0 || dc === 0 || Math.abs(dr) === Math.abs(dc);
    if (lurus) { selAkhir = cand; gambarSeleksi(document.getElementById('ckGrid')); }
  });
  window.addEventListener('pointerup', () => {
    if (!sedangMemilih) return;
    sedangMemilih = false;
    const g = document.getElementById('ckGrid');
    if (g) selesaiSeleksi(g);
  });
}

function jalurDariSeleksi() {
  if (!selAwal || !selAkhir) return [];
  const dr = Math.sign(selAkhir.r - selAwal.r), dc = Math.sign(selAkhir.c - selAwal.c);
  const panjang = Math.max(Math.abs(selAkhir.r - selAwal.r), Math.abs(selAkhir.c - selAwal.c)) + 1;
  const jalur = [];
  for (let i = 0; i < panjang; i++) jalur.push([selAwal.r + dr * i, selAwal.c + dc * i]);
  return jalur;
}

function gambarSeleksi(grid) {
  const jalur = jalurDariSeleksi();
  const jalurSet = new Set(jalur.map(([r, c]) => `${r},${c}`));
  grid.querySelectorAll('.ck-cell').forEach(cell => {
    if (cell.classList.contains('found')) return;
    cell.classList.toggle('selecting', jalurSet.has(`${cell.dataset.r},${cell.dataset.c}`));
  });
}

async function selesaiSeleksi(grid) {
  const jalur = jalurDariSeleksi();
  grid.querySelectorAll('.ck-cell.selecting').forEach(cell => cell.classList.remove('selecting'));
  const match = cocokkanJalurCariKata(jalur, PUZZLE.placements, ditemukan);
  selAwal = null; selAkhir = null;
  if (!match) return;

  ditemukan.add(match.kata);
  const waktuMs = Date.now() - mulaiWaktu;
  const skorDidapat = 10;
  skorTotal += skorDidapat;
  const soalIndex = PUZZLE.placements.findIndex(p => p.kata === match.kata);

  renderWordlist();
  renderGrid();
  renderProgress();

  if (MODE === 'live' && PESERTA) {
    try {
      await supabase.from('game_jawaban').insert({
        sesi_id: SESI.id, peserta_id: PESERTA.id, soal_index: soalIndex,
        benar: true, waktu_ms: waktuMs, skor_didapat: skorDidapat
      });
    } catch (e) { /* mungkin dobel-submit, abaikan */ }
    const selesaiSemua = ditemukan.size >= WORDS.length;
    await supabase.from('game_peserta')
      .update({ skor_total: skorTotal, soal_selesai: ditemukan.size, status: selesaiSemua ? 'selesai' : 'main' })
      .eq('id', PESERTA.id);
  }

  if (ditemukan.size >= WORDS.length) {
    setTimeout(tampilkanHasilAkhir, 500);
  }
}

async function tampilkanHasilAkhir() {
  const c = document.getElementById('ckContainer');
  document.getElementById('ckProgress').textContent = '';
  const totalMax = WORDS.length * 10;
  c.innerHTML = `
    <div class="ck-card ck-final">
      <div style="font-size:44px;">🎉</div>
      <div>Kerja bagus!</div>
      <div class="skor-besar">${skorTotal} / ${totalMax}</div>
      <div style="color:#8A90A3; font-size:13px;">${WORDS.length} kata berhasil kamu temukan</div>
      <div>
        ${MODE === 'mandiri' ? '<button id="btnMainLagi">🔁 Main Lagi</button>' : ''}
        <button onclick="location.href='menu-game.html'" style="background:#F1F2F6; color:#1f2937;">Kembali ke Menu</button>
      </div>
    </div>
  `;
  if (MODE === 'mandiri') {
    document.getElementById('btnMainLagi').addEventListener('click', () => { skorTotal = 0; buatPuzzleBaru(); renderSoal(); });
    await supabase.from('hasil_game_mandiri').insert({
      bank_game_id: BANK_GAME_ID, profile_id: PROFILE.id, jenis: 'cari_kata',
      skor: skorTotal, total_soal: WORDS.length
    });
  }
}

async function initMandiri() {
  const { data, error } = await supabase.from('bank_game').select('id, judul, data').eq('id', BANK_ID).maybeSingle();
  if (error || !data || !(data.data || []).length) {
    document.getElementById('ckContainer').innerHTML = emptyState('Materi tidak ditemukan', 'Materi ini mungkin sudah dihapus gurumu.', '🔍');
    return;
  }
  BANK_GAME_ID = data.id;
  WORDS = (data.data || []).map(d => String(d.kata || '').toUpperCase().replace(/[^A-Z]/g, '')).filter(Boolean);
  buatPuzzleBaru();
  renderSoal();
}

async function initLive() {
  const c = document.getElementById('ckContainer');
  const { data: sesi, error } = await supabase.from('game_sesi')
    .select('id, kode, status, mode, jenis, bank_game_id')
    .eq('kode', KODE).maybeSingle();
  if (error || !sesi || sesi.status !== 'berjalan' || sesi.mode !== 'mandiri_live') {
    c.innerHTML = emptyState('Sesi tidak tersedia', 'Kode sesi salah atau sesi sudah selesai.', '🔴');
    return;
  }
  SESI = sesi;
  const { data: bank } = await supabase.from('bank_game').select('id, data').eq('id', sesi.bank_game_id).maybeSingle();
  if (!bank) { c.innerHTML = emptyState('Materi tidak ditemukan', '', '🔍'); return; }
  WORDS = (bank.data || []).map(d => String(d.kata || '').toUpperCase().replace(/[^A-Z]/g, '')).filter(Boolean);

  const { data: existing } = await supabase.from('game_peserta')
    .select('id, skor_total, soal_selesai, status')
    .eq('sesi_id', sesi.id).eq('profile_id', PROFILE.id).maybeSingle();

  buatPuzzleBaru();
  if (existing) {
    PESERTA = existing;
    skorTotal = existing.skor_total || 0;
    if (existing.status === 'selesai' || existing.soal_selesai >= WORDS.length) {
      await tampilkanHasilAkhir();
      return;
    }
  } else {
    const { data: created, error: cErr } = await supabase.from('game_peserta')
      .insert({ sesi_id: sesi.id, profile_id: PROFILE.id, nama: PROFILE.nama })
      .select('id, skor_total, soal_selesai, status').single();
    if (cErr || !created) { c.innerHTML = emptyState('Gagal bergabung', 'Coba muat ulang halaman.', '⚠️'); return; }
    PESERTA = created;
  }
  renderSoal();
}

(async function () {
  const profile = await requireLogin();
  if (!profile) return;
  PROFILE = profile;

  if (MODE === 'mandiri' && BANK_ID) {
    await initMandiri();
  } else if (MODE === 'live' && KODE) {
    await initLive();
  } else {
    document.getElementById('ckContainer').innerHTML = emptyState('Halaman tidak valid', 'Silakan masuk lewat menu Game.', '⚠️');
  }
})();
</script>

</body>
</html>
