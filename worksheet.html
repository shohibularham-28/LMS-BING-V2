<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worksheet — English Learning Hub</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div id="app-screen">
  <div class="shell">
    <div class="sidebar">
      <div class="brand">
        <div class="brand-icon"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 5.5C4 4.67157 4.67157 4 5.5 4H10.5C11.3284 4 12 4.67157 12 5.5V19.5C12 18.6716 11.3284 18 10.5 18H4V5.5Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/><path d="M20 5.5C20 4.67157 19.3284 4 18.5 4H13.5C12.6716 4 12 4.67157 12 5.5V19.5C12 18.6716 12.6716 18 13.5 18H20V5.5Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
        <div class="brand-name display">English Class</div>
      </div>

      <div class="user-card">
        <div class="avatar" id="userAvatar">D</div>
        <div class="name" id="sideName">—</div>
        <span class="kelas-tag" id="sideClass">Kelas —</span>
      </div>

      <div class="nav-section-label">Menu Utama</div>
      <a class="nav-item" data-page="pengumuman" href="pengumuman.html">
        <span class="icon">📣</span> Pengumuman &amp; Nilai
      </a>
      <a class="nav-item" data-page="materi" href="materi.html">
        <span class="icon">📘</span> Materi
      </a>
      <a class="nav-item active" data-page="worksheet" href="worksheet.html">
        <span class="icon">📝</span> Worksheet
      </a>

      <div class="nav-section-label">Akun</div>
      <a class="nav-item" data-page="pengaturan" href="pengaturan.html">
        <span class="icon">⚙️</span> Pengaturan
      </a>

      <div class="sidebar-footer">
        <button class="logout-btn" onclick="doLogout()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Keluar</button>
      </div>
    </div>

    <div class="main">
      <div class="topbar">
        <div>
          <div class="greeting"><span class="wave">👋</span>Halo, <span id="topName">—</span></div>
          <div class="date" id="topDate"></div>
        </div>
        <div class="level-pill"><span id="topLevel">X</span> · <span id="topKelasName">—</span></div>
      </div>

      <div class="content">
        <div class="page-header">
          <div class="eyebrow">Practice</div>
          <h1>Worksheet</h1>
        </div>
        <div id="worksheet-container">Memuat…</div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabaseClient.js"></script>
<script src="assets/app.js"></script>
<script>
(async function () {
  const profile = await requireLogin();
  if (!profile) return;
  renderShell(profile, 'worksheet');

  const wsC = document.getElementById('worksheet-container');
  const level = profile.kelas ? profile.kelas.level : getLevel(profile.kelas ? profile.kelas.nama : '');
  const { data } = await supabase
    .from('worksheet')
    .select('judul, meta, url, mulai, deadline')
    .or(`level.eq.${level},kelas_id.eq.${profile.kelas_id}`)
    .order('created_at', { ascending: false });

  const list = data || [];
  const now = new Date();
  const todayStr = now.toISOString().slice(0, 10);

  wsC.innerHTML = list.length ? list.map(w => {
    const notStarted = w.mulai && new Date(w.mulai) > now;
    const closed = w.deadline && w.deadline < todayStr;

    let statusClass = 'status-open';
    let statusLabel = 'Terbuka';
    if (notStarted) { statusClass = 'status-due'; statusLabel = 'Belum Dibuka'; }
    else if (closed) { statusClass = 'status-due'; statusLabel = 'Sudah Ditutup'; }

    const mulaiTxt = w.mulai
      ? new Date(w.mulai).toLocaleString('id-ID', { day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' })
      : null;
    const deadlineTxt = w.deadline
      ? new Date(w.deadline).toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' })
      : null;
    const metaBits = [esc(w.meta || 'Worksheet interaktif online')];
    if (mulaiTxt) metaBits.push((notStarted ? 'Mulai: ' : 'Dibuka sejak: ') + mulaiTxt);
    if (deadlineTxt) metaBits.push('Deadline: ' + deadlineTxt);

    let btn;
    if (notStarted) {
      btn = `<a class="btn-ws" href="javascript:void(0)" style="opacity:.5;cursor:not-allowed;" onclick="alert('Worksheet ini belum bisa dibuka. Mulai: ${esc(mulaiTxt)}.');return false;">Kerjakan</a>`;
    } else if (closed) {
      btn = `<a class="btn-ws" href="javascript:void(0)" style="opacity:.5;cursor:not-allowed;" onclick="alert('Worksheet ini sudah melewati batas waktu.');return false;">Kerjakan</a>`;
    } else {
      btn = `<a class="btn-ws" href="${esc(w.url)}" target="_blank" rel="noopener">Kerjakan</a>`;
    }

    return `
    <div class="ws-card">
      <div class="ws-info">
        <h3>${esc(w.judul)}</h3>
        <div class="meta">${metaBits.join(' · ')}</div>
      </div>
      <div class="ws-right">
        <span class="ws-status ${statusClass}">${statusLabel}</span>
        ${btn}
      </div>
    </div>
  `;
  }).join('') : emptyState("Belum ada worksheet", "Tugas dan latihan akan muncul di sini saat guru menerbitkannya.", "📝");
})();
</script>

</body>
</html>
