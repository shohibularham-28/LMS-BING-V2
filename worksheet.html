<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worksheet — English Learning Hub</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div id="app-screen" class="no-sidebar">
  <div class="shell">

    <div class="main">
      <div class="topbar">
        <div class="topbar-left">
          <div class="topbar-userinfo">
            <div class="greeting"><span class="wave">👋</span>Halo, <span id="topName">—</span></div>
            <div class="date" id="topDate"></div>
          </div>
        </div>
        <div class="topbar-right">
          <div class="notif-wrap">
            <button class="notif-bell" id="notifBell" type="button" aria-label="Notifikasi">🔔<span class="notif-dot" id="notifDot" style="display:none;"></span></button>
            <div class="notif-dropdown" id="notifDropdown">
              <div class="notif-header">Notifikasi</div>
              <div id="notifList">Memuat…</div>
            </div>
          </div>
          <div class="level-pill"><span id="topLevel">X</span> · <span id="topKelasName">—</span></div>
        <button class="topbar-logout-btn" onclick="doLogout()" type="button" title="Keluar" aria-label="Keluar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
        </div>
      </div>

      <div class="content">
        <a href="menu.html" class="btn-back-menu">← Kembali ke Menu</a>
        <div class="page-header">
          <div class="eyebrow">Practice</div>
          <h1>Worksheet</h1>
        </div>
        <div class="ws-tabs" id="wsTabs">
          <button type="button" class="ws-tab active" data-tab="worksheet">📝 Worksheet <span class="ws-tab-count" id="wsTabCountWorksheet">0</span></button>
          <button type="button" class="ws-tab" data-tab="ujian">🧪 Ujian <span class="ws-tab-count" id="wsTabCountUjian">0</span></button>
        </div>
        <div id="worksheet-container">Memuat…</div>
      </div>
    </div>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabaseClient.js"></script>
<script src="assets/app.js"></script>
<script>
(async function () {
  const profile = await requireLogin();
  if (!profile) return;
  renderShell(profile, 'worksheet');
  initNotifDropdown();
  await loadStudentNotifications(profile);

  const wsC = document.getElementById('worksheet-container');
  const level = profile.kelas ? profile.kelas.level : getLevel(profile.kelas ? profile.kelas.nama : '');

  const [wsRes, juRes] = await Promise.all([
    supabase
      .from('worksheet')
      .select('judul, meta, url, mulai, deadline, created_at')
      .or(`level.eq.${level},kelas_id.eq.${profile.kelas_id}`)
      .order('created_at', { ascending: false }),
    // RLS jadwal_ujian sudah otomatis membatasi hanya baris yang menyasar
    // tingkat/kelas siswa ini (lihat fungsi public.ujian_terlihat_untukku).
    supabase
      .from('jadwal_ujian')
      .select('id, judul, mulai, deadline, created_at')
      .order('created_at', { ascending: false })
  ]);

  const now = new Date();
  const todayStr = now.toISOString().slice(0, 10);

  // Worksheet & Ujian terbaru (created_at terbaru) selalu di urutan paling atas —
  // sudah dijamin oleh .order('created_at', {ascending:false}) di query masing-masing di atas.
  const worksheetItems = (wsRes.data || []).map(w => ({
    tipe: 'worksheet', judul: w.judul, meta: w.meta || 'Worksheet interaktif online',
    url: w.url, mulai: w.mulai, deadline: w.deadline, created_at: w.created_at
  }));
  const ujianItems = (juRes.data || []).map(j => ({
    tipe: 'ujian', judul: j.judul, meta: 'Ujian',
    url: 'soal.html?jadwal=' + j.id, mulai: j.mulai, deadline: j.deadline, created_at: j.created_at
  }));

  document.getElementById('wsTabCountWorksheet').textContent = worksheetItems.length;
  document.getElementById('wsTabCountUjian').textContent = ujianItems.length;

  function renderCard(w) {
    const notStarted = w.mulai && new Date(w.mulai) > now;
    const closed = w.deadline && w.deadline < todayStr;

    let statusClass = 'status-open';
    let statusLabel = 'Terbuka';
    if (notStarted) { statusClass = 'status-due'; statusLabel = 'Belum Dibuka'; }
    else if (closed) { statusClass = 'status-due'; statusLabel = 'Sudah Ditutup'; }

    const mulaiTxt = w.mulai
      ? new Date(w.mulai).toLocaleString('id-ID', { day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' })
      : null;
    const deadlineTxt = w.deadline
      ? new Date(w.deadline).toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' })
      : null;
    const badge = w.tipe === 'ujian' ? '🧪 ' : '📝 ';
    const metaBits = [esc(badge + w.meta)];
    if (mulaiTxt) metaBits.push((notStarted ? 'Mulai: ' : 'Dibuka sejak: ') + mulaiTxt);
    if (deadlineTxt) metaBits.push('Deadline: ' + deadlineTxt);

    let btn;
    if (notStarted) {
      btn = `<a class="btn-ws" href="javascript:void(0)" style="opacity:.5;cursor:not-allowed;" onclick="alert('Ini belum bisa dibuka. Mulai: ${esc(mulaiTxt)}.');return false;">Kerjakan</a>`;
    } else if (closed) {
      btn = `<a class="btn-ws" href="javascript:void(0)" style="opacity:.5;cursor:not-allowed;" onclick="alert('Ini sudah melewati batas waktu.');return false;">Kerjakan</a>`;
    } else if (w.tipe === 'ujian') {
      btn = `<a class="btn-ws" href="${esc(w.url)}">Kerjakan</a>`;
    } else {
      btn = `<a class="btn-ws" href="${esc(w.url)}" target="_blank" rel="noopener">Kerjakan</a>`;
    }

    return `
    <div class="ws-card">
      <div class="ws-info">
        <h3>${esc(w.judul)}</h3>
        <div class="meta">${metaBits.join(' · ')}</div>
      </div>
      <div class="ws-right">
        <span class="ws-status ${statusClass}">${statusLabel}</span>
        ${btn}
      </div>
    </div>
  `;
  }

  function renderTab(tab) {
    const items = tab === 'ujian' ? ujianItems : worksheetItems;
    wsC.innerHTML = items.length
      ? items.map(renderCard).join('')
      : (tab === 'ujian'
        ? emptyState("Belum ada ujian", "Ujian yang diterbitkan guru akan muncul di sini.", "🧪")
        : emptyState("Belum ada worksheet", "Tugas dan latihan akan muncul di sini saat guru menerbitkannya.", "📝"));
  }

  let activeTab = (new URLSearchParams(window.location.search).get('tab') === 'ujian') ? 'ujian' : 'worksheet';

  document.querySelectorAll('.ws-tab').forEach(btn => {
    if (btn.dataset.tab === activeTab) btn.classList.add('active'); else btn.classList.remove('active');
    btn.addEventListener('click', () => {
      if (btn.dataset.tab === activeTab) return;
      activeTab = btn.dataset.tab;
      document.querySelectorAll('.ws-tab').forEach(b => b.classList.toggle('active', b === btn));
      renderTab(activeTab);
    });
  });

  renderTab(activeTab);
})();
</script>

</body>
</html>
